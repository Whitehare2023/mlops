server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/mlops_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    time-zone: Asia/Shanghai

mlops:
  python-executable: python
  script-path: ../scripts/mock_process.py
  output-root: ../output


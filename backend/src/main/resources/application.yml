server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/mlops_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    time-zone: Asia/Shanghai

mlops:
  python-executable: ${MLOPS_PYTHON:../.venv/Scripts/python.exe}
  script-path: ${MLOPS_SCRIPT_PATH:../scripts/mock_process.py}
  output-root: ${MLOPS_OUTPUT_ROOT:../output}
